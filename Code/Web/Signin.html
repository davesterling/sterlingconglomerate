<!DOCTYPE html>
<html>
  <head>
    <title>Sheets API Quickstart</title>
    <meta charset="utf-8" />
  </head>
  <body>
    <p>Sheets API Quickstart</p>





    <pre id="content" style="white-space: pre-wrap;"></pre>




    <div id="g_id_onload"
    data-client_id="335082268909-jrmq8d9jsg37qd7t995d67a9l6u1q88e.apps.googleusercontent.com"
    data-context="signin"
    data-ux_mode="popup"
    data-login_uri=""
    data-auto_select="true"
    data-itp_support="true">
  </div>
  
  <div class="g_id_signin"
    data-type="standard"
    data-shape="pill"
    data-theme="outline"
    data-text="signin"
    data-size="large"
    data-logo_alignment="left">
  </div>





    <script type="text/javascript">
      // TODO: Replace with your client ID and API key
      const CLIENT_ID = '100313983389899746972';
      const API_KEY = 'a4c95364a0442f011a8bcb5462f7d1839830e990';

      const DISCOVERY_DOC = 'https://sheets.googleapis.com/$discovery/rest?version=v4';

      const SCOPES = 'https://www.googleapis.com/auth/spreadsheets.readonly';

      let tokenClient;
      let gapiInited = false;
      let gisInited = false;

      async function initializeGapiClient() {
        await gapi.client.init({
          apiKey: API_KEY,
          discoveryDocs: [DISCOVERY_DOC],
        });
        gapiInited = true;
        await listMajors();
      }

      async function gisLoaded() {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: SCOPES,
        });
        gisInited = true;
        await initializeGapiClient();
      }

      function handleAuthClick() {
        tokenClient.callback = async (resp) => {
          if (resp.error !== undefined) {
            throw (resp);
          }
          await listMajors();
        };

        tokenClient.requestAccessToken({ prompt: 'consent' });
      }

      async function listMajors() {
        let response;
        try {
          response = await gapi.client.sheets.spreadsheets.values.get({
            spreadsheetId: '1lHKLgpi5QhrkV10XyxqXH2gZ8ovbnFfCFLOktwpQC1s',
            range: 'Users!A2:E',
          });
        } catch (err) {
          document.getElementById('content').innerText = err.message;
          return;
        }
        const range = response.result;
        if (!range || !range.values || range.values.length == 0) {
          document.getElementById('content').innerText = 'No values found.';
          return;
        }
        const output = range.values.reduce(
          (str, row) => `${str}${row[0]}, ${row[4]}\n`,
          'Name, Major:\n'
        );
        document.getElementById('content').innerText = output;
      }
    </script>
    <script async defer src="https://apis.google.com/js/api.js" onload="gapi.load('client', initializeGapiClient)"></script>
    <script async defer src="https://accounts.google.com/gsi/client" onload="google.accounts.id.initialize({ client_id: CLIENT_ID, callback: gisLoaded })"></script>
    <button onclick="handleAuthClick()">Authorize</button>
  </body>
</html>
