<!DOCTYPE html>
<html>
  <head>
    <title>Google Sheets API Example</title>
    <script src="https://apis.google.com/js/api.js"></script>
    <script>
      function handleClientLoad() {
        gapi.load('client:auth2', initClient);
      }

      function initClient() {
        gapi.client.init({
          apiKey: 'AIzaSyCWa-ZW9I5I19flO9gHZ7GcZZbfMnMiQ6A',
          clientId: '100313983389899746972',
          discoveryDocs: ['https://sheets.googleapis.com/$discovery/rest?version=v4'],
          scope: 'https://www.googleapis.com/auth/spreadsheets'
        }).then(function () {
          executeProcesses();
        }).catch(function (error) {
          console.error('Error initializing Google Sheets API:', error);
        });
      }

      function executeProcesses() {
        var spreadsheetId = '1lHKLgpi5QhrkV10XyxqXH2gZ8ovbnFfCFLOktwpQC1s';
        var sales = [["Mikayla", "Address", "Name", 30], ["Sale2", "Address2", "Name2", 40]];

        var params = {
          spreadsheetId: spreadsheetId,
          range: 'Users!B1',
          valueInputOption: 'USER_ENTERED',
          resource: {
            values: sales
          }
        };

        gapi.client.sheets.spreadsheets.values.update(params).then(function (response) {
          console.log('Values updated in Google Sheet.');
          fetchValues();
        }).catch(function (error) {
          console.error('Error updating values in Google Sheet:', error);
        });
      }

      function fetchValues() {
        var spreadsheetId = '1lHKLgpi5QhrkV10XyxqXH2gZ8ovbnFfCFLOktwpQC1s';

        var params = {
          spreadsheetId: spreadsheetId,
          range: 'Users!A1:G16'
        };

        gapi.client.sheets.spreadsheets.values.get(params).then(function (response) {
          var values = response.result.values;
          console.log('Fetched values from Google Sheet:', values);
        }).catch(function (error) {
          console.error('Error fetching values from Google Sheet:', error);
        });
      }
    </script>
  </head>
  <body>
    <h1>Google Sheets API Example</h1>

    <script src="https://apis.google.com/js/client.js?onload=handleClientLoad"></script>
  </body>
</html>
