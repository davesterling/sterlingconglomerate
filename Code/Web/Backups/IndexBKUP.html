<script>
    function toggleFuzzyGlow() {
  const buttons = document.querySelectorAll('button');
  buttons.forEach(button => {
    if (window.innerWidth < 770) {
      button.classList.add('fuzzy-glow');
    } else {
      button.classList.remove('fuzzy-glow');
    }
  });
}
window.addEventListener('resize', toggleFuzzyGlow);

/*Tabs*/

const tabs = document.querySelectorAll('.tab');
const sections = document.querySelectorAll('.section');

tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    const target = tab.dataset.target;
    sections.forEach(section => {
      section.classList.remove('active');
    });
    document.querySelector(target).classList.add('active');
    tabs.forEach(tab => {
      tab.classList.remove('active');
    });
    tab.classList.add('active');
  });
});


window.onload = function() {
  var transitionContainer = document.querySelector('.transition-container');
  transitionContainer.classList.add('hide-transition');



  window.addEventListener('load', function() {
  document.getElementById('transition').style.backgroundSize = '200% 200%';
});
}



</script>
