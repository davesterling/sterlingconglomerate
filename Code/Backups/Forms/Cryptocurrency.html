.glow-on-hover {
    width: 220px;
    height: 50px;
    border: none;
    outline: none;
    color: #fff;
    background: #111;
    cursor: pointer;
    position: relative;
    z-index: ;
    border-radius: 10px;
}

.glow-on-hover:before {
    content: '';
    background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
    position: absolute;
    top: -2px;
    left:-2px;
    background-size: 400%;
    z-index: -1;
    filter: blur(5px);
    width: calc(100% + 4px);
    height: calc(100% + 4px);
    animation: glowing 20s linear infinite;
    opacity: 0;
    transition: opacity .3s ease-in-out;
    border-radius: 10px;
}

.glow-on-hover:active {
    color: #000
}

.glow-on-hover:active:after {
    background: transparent;
}

.glow-on-hover:hover:before {
    opacity: 1;
}

.glow-on-hover:after {
    z-index: -1;
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background: #111;
    left: 0;
    top: 0;
    border-radius: 10px;
}

@keyframes glowing {
    0% { background-position: 0 0; }
    50% { background-position: 400% 0; }
    100% { background-position: 0 0; }
}

import java.sql.*;

public class TextBoxToDatabase {
  public static void main(String[] args) {
    // Replace with your database url, username, and password
    String dbUrl = "jdbc:mysql://localhost:3306/mydatabase";
    String dbUsername = "username";
    String dbPassword = "password";

    // Get the value of the text box from the website
    String textBoxValue = "txt_name";

    // Connect to the database
    Connection conn = null;
    try {
      conn = DriverManager.getConnection(dbUrl, dbUsername, dbPassword);

      // Insert the text box value into the database
      String query = "INSERT INTO text_box_values (value) VALUES (?)";
      PreparedStatement statement = conn.prepareStatement(query);
      statement.setString(1, textBoxValue);
      statement.executeUpdate();
    } catch (SQLException e) {
      e.printStackTrace();
    } finally {
      // Close the connection
      if (conn != null) {
        try {
          conn.close();
        } catch (SQLException e) {
          e.printStackTrace();
        }
      }
    }
  }
}
