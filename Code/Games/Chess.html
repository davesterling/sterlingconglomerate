<html>
  <head>
    <title>Pong Game</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #game {
        width: 500px;
        height: 400px;
        border: 2px solid black;
        position: relative;
      }

      #computerPaddle {
        width: 20px;
        height: 50px;
        background: #999;
        position: absolute;
        left: 0px;
        top: 175px;
        border: 1px solid black;
      }

      #playerPaddle {
        width: 20px;
        height: 50px;
        background: #999;
        position: absolute;
        right: 0px;
        top: 175px;
        border: 1px solid black;
      }

      #ball {
        width: 10px;
        height: 10px;
        background: #999;
        position: absolute;
        left: 245px;
        top: 195px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <h1>Pong Game</h1>
    <div id="game">
      <div id="computerPaddle"></div>
      <div id="playerPaddle"></div>
      <div id="ball"></div>
    </div>

    <script>
      // Initialize variables
      let computerPaddle = document.getElementById("computerPaddle");
      let playerPaddle = document.getElementById("playerPaddle");
      let ball = document.getElementById("ball");
      let computerY = 175;
      let playerY = 175;
      let ySpeed = 2;
      let xSpeed = 2;

      // Listen for mouse movement and move player paddle accordingly
      document.addEventListener("mousemove", function(e){
        playerY = e.clientY - 25;
        playerPaddle.style.top = playerY + "px";
      });
      
      document.addEventListener("keydown", function (e) {
    if (e.keyCode == 32) {
      // Get the ball's current position
      let x = parseInt(ball.style.left);
      let y = parseInt(ball.style.top);
  
      // Update the ball's x and y positions
      x += xSpeed;
      y += ySpeed;
  
      // Update the ball's css
      ball.style.left = x + "px";
      ball.style.top = y + "px";
    }
  });

      // Move the computer paddle
      function moveComputerPaddle(){
        // Get the center of the computer's paddle
        let computerCenter = computerY + 25;

        // Get the center of the ball
        let ballCenter = parseInt(ball.style.top) + 5;

        // Set the computer's paddle speed
        let speed = 2;

        // Move the paddle up if the center of the ball is above the center of the paddle
        if(computerCenter > ballCenter){
          computerY -= speed;
        }

        // Move the paddle down if the center of the ball is below the center of the paddle
        if(computerCenter < ballCenter){
          computerY += speed;
        }

        // Ensure the paddle stays within the game boundaries
        if(computerY < 0){
          computerY = 0;
        }
        if(computerY > 350){
          computerY = 350;
        }

        // Update the computer paddle's css
        computerPaddle.style.top = computerY + "px";
      }
      // Move the ball
      function moveBall(){
        // Get the ball's current position
        let x = parseInt(ball.style.left);
        let y = parseInt(ball.style.top);
        // Set a variable to determine if the game has ended
        let gameOver = false;

        // Update the ball's x and y positions
        x += xSpeed;
        y += ySpeed;

        // Keep the ball in the game
        if(x > 490){
          xSpeed = -2;
        }
        if(x < 10){
          xSpeed = 2;
        }
        if(y > 390){
          ySpeed = -2;
        }
        if(y < 10){
          ySpeed = 2;
        }

        
           document.addEventListener('keydown', function(e) {
            if (e.keyCode == 32) {
                start = true;

                //Set random speed
                speedX = Math.floor((Math.random() * 10) + 1);
                speedY = Math.floor((Math.random() * 10) + 1);

            }
        }); 
         if (start) {
                ballX += speedX;
                ballY += speedY;
            }
        
        
        // Check for collision with paddles
        if(x < 30){
          if(y > computerY && y < computerY + 50){
            xSpeed = 2;
          } else {
            // Game over
            gameOver = true;
          }
        }
        if(x > 470){
          if(y > playerY && y < playerY + 50){
            xSpeed = -2;
          } else {
            // Game over
            gameOver = true;
          }
        }

        // Update the ball's css
        ball.style.left = x + "px";
        ball.style.top = y + "px";

        // End the game if gameOver is true
        if(gameOver){
          alert("Game Over!");
          document.location.reload();
        }
      }

      // Move the paddles and the ball every 10ms
      setInterval(function(){
        moveComputerPaddle();
        moveBall();
      }, 10);
    </script>
  </body>
</html>
