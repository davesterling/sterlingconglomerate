      <script>
      let width = 400;

      class Ball {
        constructor

        {
          this.x = width/2;
          this.y = height/2;
          this.diameter = 20;
          this.speed = 2;
          this.xspeed = this.speed;
          this.yspeed = this.speed;
        }
        
        show() {
          fill(255, 0, 0);
          ellipse(this.x, this.y, this.diameter, this.diameter);
        }
        
        move() {
          this.x += this.speed;
          this.y += this.yspeed;
          
          // Bounce off walls
          if (this.x > width || this.x < 0) {
            this.xspeed *= -1;
          }
          if (this.y > height || this.y < 0) {
            this.yspeed *= -1;
          }
        }
      }
      
      let ball = new Ball();
